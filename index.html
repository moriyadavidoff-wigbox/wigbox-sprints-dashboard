<title>WIGBOX דשבורדים</title>
<style>
:root { --bg: #fbfbfa; --panel: #ffffff; --fg: #24231f; --muted: #6b6a63; --line: #e4e3dc; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1b19; --panel: #232320; --fg: #ecebe6; --muted: #a3a29a; --line: #3a3a35; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 -apple-system, "Segoe UI", "Arial Hebrew", Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 40px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); }
h1 { font: 400 30px/1.2 Georgia, "David", "Times New Roman", serif; margin: 0 0 6px; }
p { color: var(--muted); margin: 0 0 24px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; color: inherit; text-decoration: none; }
a.card:hover, a.card:focus-visible { border-color: var(--fg); outline: none; }
a.card b { display: block; font-size: 17px; }
a.card span { color: var(--muted); font-size: 13px; }
</style>
</head>

<main>

</ul>
</main>
</body>
</html>
